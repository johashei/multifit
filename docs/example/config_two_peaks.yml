# This is an example config for multifit.
#
# Find more information about YAML syntax here:
# <https://yamline.com/tutorial/>

---
data:
  directory: /home/jsh/experiments/GanilE706rdds/data/Mo108/singles/ # path/to/your/files/
  files:
    - 0030um.npy # data_file_1  # These can be in ascii or npy format
    - 0052um.npy # data_file_2
    - 0089um.npy # ...
    - 0155um.npy
    - 0264um.npy
    - 0450um.npy
    - 0780um.npy
    - 1170um.npy
    - 1776um.npy
    - 2650um.npy
  column: 1 # which column of the data file contains the counts, numbered from 0
  delimiter: ',' # column delimiter in the data file
  bin_width: 0.5 # bin width of the data
model:
  module: ./model_cdf_examples.py  # path/to/python/file.py
  function: peaks_multiple # name of function to fit
  spectrum_params:   # parematers with the same value for all peaks in the same
    - σ0             # spectrum.
    - σ1
    - separation
    - refarea
  peak_params:       # parameters with the same value for all peaks of the same
    - separation     # number, across spectra.
    - σ0
    - σ1
    - x0
    - relarea
  kwargs:
    xmin: &xmin 467.0   # additional keyword arguments of the model function wich
    xmax: &xmax 539.0   # should not be included in the fit. Often includes fitrange
  number_of_peaks: 2 # how many peaks to fit. Each will be fitted by the given function.
fit:
  range: &range [*xmin, *xmax] # limits of the fit
  parameter_ranges:
  # parameters are noted as <name>_<peak>_<spectrum>. Both <peak> and <spectrum> may be
  # replaced by a wildcard *, indicating all. <name> is equivalent to <name>_*_*.
    x0_0_*:  [525, 529]      # Ranges within which each parameter is allowed
    x0_1_*:  [527.5, 531.5]  # When fitting overlapping peaks, ranges must be narrow.
    separation: [0, 20]
    σ0: [0, 5]
    σ1: [0, 5]
    refarea: [0, null]
    relarea: [0, 1]
    ratio: [0, 1]
    slope_0_*: [null, null]  # Since the background is independent of the peaks,
    offset_0_*: [0, null]    # only one background is used in the fit.
    slope_1_*: [0, 0]        # The other is set to 0.
    offset_1_*: [0, 0]
  initial_values:
    x0_0_*: 527.0            # Initial value for each parameter
    x0_1_*: 529.5
    separation: 9.0
    σ0: 1.0
    σ1: 1.0
    refarea: 280
    relarea_0_*: 1
    relarea_1_*: 0.2
    ratio: 0.5
    slope_0_*: 0.0
    offset_0_*: 50.0
    slope_1_*: 0            # These parameters have been fixed to 0, but for the
    offset_1_*: 0           # code to run they still need initial values.
...

